name: Deploy

on:
  push:
    branches: [main]
    paths: [index.html]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Upload to mia.drdplus.info/hodiny.html
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            root@drdplus.info "$(sha256sum < index.html | cut -d' ' -f1)" < index.html

      - name: Verify the live page matches the commit
        run: |
          expected=$(md5sum < index.html)
          for attempt in 1 2 3 4 5; do
            if [ "$(curl -fsS https://mia.drdplus.info/hodiny.html | md5sum)" = "$expected" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "Live page differs from the deployed commit" >&2
          exit 1
